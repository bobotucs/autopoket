<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Practice</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5f6b7a; --line:#e3e7ec;
    --accent:#2f5bd3; --accent-soft:#e8eefc;
    --good:#1f8a4c; --good-soft:#e5f5ec; --bad:#c23b3b; --bad-soft:#fbeaea; --warn:#b7791f; --warn-soft:#fdf3e1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171c; --card:#1d2129; --ink:#e7eaf0; --muted:#9aa4b2; --line:#2e3440;
      --accent:#7d9cf5; --accent-soft:#25304a; --good:#5cc98a; --good-soft:#1c3327; --bad:#f07a7a; --bad-soft:#3a2224; --warn:#e8b55c; --warn-soft:#3a3020; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.6rem;margin:0 0 4px}
  h2{font-size:1.2rem;margin:28px 0 10px}
  h3{font-size:1rem;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .mode{text-align:left;padding:16px}
  .mode b{display:block;margin-bottom:2px}
  .mode span{color:var(--muted);font-size:.9rem}
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 16px;margin:10px 0}
  .topics label{display:flex;gap:8px;align-items:center;font-size:.95rem}
  .progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .progress div{height:100%;background:var(--accent);transition:width .2s}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
  .tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .q{font-size:1.15rem;font-weight:600;margin:12px 0 16px}
  .opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;line-height:1.4}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{background:var(--good-soft);border-color:var(--good);opacity:1}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
  .opt .k{display:inline-block;width:1.6em;font-weight:700;color:var(--muted)}
  .fb{border-radius:8px;padding:12px 14px;margin:6px 0 14px}
  .fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
  .big{font-size:2.6rem;font-weight:800;line-height:1}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--bg);border-radius:10px;padding:14px}
  .stat .l{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:.85rem}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
  .bar div{height:100%}
  .lvl{font-size:.8rem;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .lvl.s{background:var(--good-soft);color:var(--good)} .lvl.r{background:var(--warn-soft);color:var(--warn)} .lvl.w{background:var(--bad-soft);color:var(--bad)}
  .miss{border-left:4px solid var(--bad);padding:10px 14px;margin:0 0 12px;background:var(--bg);border-radius:0 8px 8px 0}
  .miss .yours{color:var(--bad)} .miss .right{color:var(--good)}
  .miss .ex{color:var(--muted);font-size:.92rem;margin-top:4px}
  .hist button{width:100%;text-align:left;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
  .note{color:var(--muted);font-size:.88rem}
  .hidden{display:none}
  .mode.locked{opacity:.45;cursor:not-allowed}
  .opt.sel{background:var(--accent-soft);border-color:var(--accent)}
  .inp{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  .inp.need{border-color:var(--bad)}
  .gh{margin:10px 0 2px;font-weight:700}
  #rRight li{margin-bottom:6px}
  .mode.locked{opacity:.45;cursor:not-allowed}
  ul.study{margin:6px 0 0 18px;padding:0}
  ul.study li{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <h1>Exam Practice</h1>

  <div class="card">
    <h3>Core Exam</h3>
    <div class="row" style="margin-top:10px">
      <input id="taker" type="text" maxlength="60" placeholder="Your name" class="inp" style="flex:1;min-width:200px">
      <button class="primary" id="coreBtn">Start</button>
    </div>

    <h3 style="margin-top:24px">Extra practice <span id="lockTag" class="lvl w">🔒 Locked</span></h3>
    <p class="note" id="lockNote" style="margin:4px 0 0">Finish the core exam to unlock.</p>
    <div class="modes" style="margin-top:12px">
      <button class="mode" data-mode="random"><b>Random 40</b></button>
      <button class="mode" data-mode="topics"><b>Topic drill</b></button>
    </div>
    <div id="topicPick" class="hidden" style="margin-top:16px">
      <div class="topics" id="topicList"></div>
      <div class="row"><button class="primary" id="startTopics">Start</button><button id="allTopics">Select all</button><button id="noTopics">Clear</button></div>
    </div>
  </div>

  <h2>Your attempts</h2>
  <div id="history" class="hist"></div>

  <div id="inbox" class="hidden">
    <h2 id="sent-results">Results people sent you</h2>
    <div class="card">
      <div class="row">
        <input id="importBox" type="text" placeholder="Paste a results link" class="inp" style="flex:1;min-width:200px">
        <button class="primary" id="importBtn">Open</button>
      </div>
      <p id="importMsg" class="note" style="margin:6px 0 0"></p>
      <div id="received" class="hist" style="margin-top:12px"></div>
    </div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="meta"><span id="qNum"></span><span id="qMode"></span></div>
  <div class="progress"><div id="qBar"></div></div>
  <div class="card">
    <span class="tag" id="qTopic"></span>
    <div class="q" id="qText"></div>
    <div id="qOpts"></div>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <button id="backBtn">Back</button>
      <button class="primary" id="nextBtn" disabled>Next</button>
    </div>
  </div>
</section>

<section id="results" class="hidden">
  <div class="row" style="justify-content:space-between">
    <h1 id="rTitle">Results</h1>
    <button id="homeBtn">Back to start</button>
  </div>
  <p class="sub" id="rDate"></p>
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="l">Score</div><div class="big" id="rPct"></div></div>
      <div class="stat"><div class="l">Correct</div><div class="big" id="rCorrect" style="color:var(--good)"></div></div>
      <div class="stat"><div class="l">Missed</div><div class="big" id="rWrong" style="color:var(--bad)"></div></div>
    </div>
  </div>

  <div class="card" id="rSend">
    <h3>Send your results</h3>
    <div class="row" style="margin-top:10px">
      <input id="sendBox" type="text" readonly class="inp" style="flex:1;min-width:200px">
      <button class="primary" id="copyBtn">Copy link</button>
    </div>
    <p id="copyMsg" class="note" style="margin:6px 0 0"></p>
  </div>

  <div class="card" id="rStudy"></div>

  <h2>By topic</h2>
  <div class="card"><table id="rTable"></table></div>

  <h2>Questions missed</h2>
  <div id="rMissed"></div>

  <h2>Questions correct</h2>
  <div class="card" id="rRight"></div>
</section>

</div>

<script>
// ---------- Topics ----------
const TOPICS = [
  "Respiratory processes & upper airway",      //0
  "Larynx & cartilages",                       //1
  "Lower respiratory tract & pleura",          //2
  "Breathing mechanics & control",             //3
  "Gas transport & lung disorders",            //4
  "Digestive overview & GI tunics",            //5
  "Mouth, pharynx & esophagus",                //6
  "Stomach",                                   //7
  "Small intestine",                           //8
  "Large intestine & peritoneal folds",        //9
  "Salivary glands & teeth",                   //10
  "Liver & gallbladder",                       //11
  "Pancreas & bile pathway",                   //12
  "Energy production & absorptive state",      //13
  "Post-absorptive state & metabolic rate",    //14
  "Temperature regulation & complications"     //15
];

// ---------- Questions: [topic, question, correct answer, [wrong answers], explanation] ----------
const Q = [
// 0 Respiratory processes & upper airway
[0,"What is the major function of the respiratory system?","Supply the body with oxygen and dispose of carbon dioxide",["Produce sound for speech","Filter toxins from the blood","Regulate body temperature"],"Main function: supply O₂ and get rid of CO₂."],
[0,"Pulmonary ventilation is best defined as:","Movement of air into and out of the lungs",["Gas exchange between blood and alveoli","Gas exchange at systemic capillaries","Transport of gases in the blood"],"Pulmonary ventilation = breathing (air moving in and out)."],
[0,"External respiration is gas exchange between:","Blood in the pulmonary circulation and the alveoli",["Blood in systemic capillaries and tissue cells","The atmosphere and the nasal cavity","Red blood cells and plasma"],"External respiration happens in the lungs: O₂ loads into the blood and CO₂ unloads into the alveoli."],
[0,"Internal respiration takes place at:","The systemic capillaries, between blood and tissue cells",["The alveoli","The respiratory bronchioles","The pulmonary capillaries"],"Internal respiration = gas exchange in the body's tissues (systemic circulation)."],
[0,"Which system carries out the transport of respiratory gases between the lungs and tissue cells?","Cardiovascular system (blood)",["Respiratory system","Lymphatic system","Nervous system"],"Transport is done by the blood, which is why the respiratory and circulatory systems are closely related."],
[0,"Which TWO of the 4 respiratory processes are the responsibility of the respiratory system itself?","Pulmonary ventilation and external respiration",["External and internal respiration","Gas transport and internal respiration","Pulmonary ventilation and gas transport"],"The first two processes belong to the respiratory system, but all four must happen for tissues to get O₂."],
[0,"The external nares are:","The nostrils (external openings of the nose)",["The paranasal sinuses","The openings into the pharynx","The nasal conchae"],"External nares = nostrils."],
[0,"What do the nasal conchae do?","Increase air turbulence and mucosal surface area, warming and moistening air",["Produce sound","Separate the nasal and oral cavities","Exchange gases with the blood"],"The conchae are mucosa-covered projections that churn air and expose it to more mucosa."],
[0,"How many nasal conchae are on each side of the nasal cavity?","3 (superior, middle, inferior)",["2 (upper and lower)","4","1"],"There are 3 conchae: superior, middle and inferior."],
[0,"Which structures surround the nasal cavity, act as resonance chambers in speech, and warm and moisten air?","Paranasal sinuses",["Nasal conchae","Vestibular folds","External nares"],"Paranasal sinuses: resonance for speech, and they warm and moisten air."],
[0,"The nasal passages are separated from the oral cavity by:","The hard palate anteriorly and the soft palate posteriorly",["The soft palate anteriorly and the hard palate posteriorly","The epiglottis","The nasal conchae"],"Hard palate in front, soft palate in back."],
[0,"The pharynx (throat) connects the nasal and oral cavities to the:","Larynx",["Trachea directly","Bronchi","Stomach directly"],"Pharynx (naso-, oro-, laryngo-) connects the nasal and oral cavities to the larynx."],

// 1 Larynx
[1,"Which is NOT one of the 3 main functions of the larynx?","Gas exchange",["Provide an open airway","Switch between the air and food channels","Voice production"],"Larynx: open airway, switching air and food, and voice. Gas exchange happens in the alveoli."],
[1,"How many cartilages make up the larynx?","9",["6","3","12"],"The larynx has 9 cartilages."],
[1,"The largest, shield-shaped laryngeal cartilage that forms the Adam's apple is the:","Thyroid cartilage",["Cricoid cartilage","Arytenoid cartilage","Epiglottis"],"Thyroid = largest, shield-shaped, laryngeal prominence."],
[1,"Which cartilage is ring-shaped and inferior to the thyroid cartilage?","Cricoid",["Cuneiform","Epiglottis","Corniculate"],"Cricoid = ring-shaped, below the thyroid."],
[1,"Which laryngeal cartilages anchor the vocal cords?","Arytenoids",["Cricoid","Thyroid","Cuneiforms"],"The arytenoids anchor the vocal cords."],
[1,"Which 3 PAIRS of small cartilages make up cartilages 3–8 of the larynx?","Arytenoid, cuneiform and corniculate",["Thyroid, cricoid and epiglottis","Arytenoid, cricoid and thyroid","Cuneiform, epiglottis and hyoid"],"Cartilages 3–8 are the paired arytenoid, cuneiform and corniculate."],
[1,"All laryngeal cartilages are hyaline cartilage EXCEPT the epiglottis, which is:","Elastic cartilage",["Fibrocartilage","Bone","Hyaline cartilage too"],"The epiglottis is flexible elastic cartilage."],
[1,"What happens during swallowing?","The larynx rises and the epiglottis tips to cover the glottis",["The larynx drops and the epiglottis opens","The vocal folds open wide","The soft palate moves down to close the mouth"],"Larynx rises and the epiglottis covers the glottis so food doesn't enter the airway."],
[1,"The vestibular folds are also called the:","False vocal cords, which do not produce sound",["True vocal cords, which produce sound","Rugae","Conchae"],"Vestibular folds = false vocal cords: superior to the vocal folds, no sound production."],
[1,"Which folds vibrate as air rushes from the lungs, producing sound?","Vocal folds (true vocal cords)",["Vestibular folds (false vocal cords)","Plicae circulares","Nasal conchae"],"True vocal cords produce sound."],
[1,"Where are the vestibular folds located relative to the vocal folds?","Superior to them",["Inferior to them","Lateral to them","In the trachea"],"Vestibular (false) folds sit above the true vocal folds."],

// 2 Lower respiratory
[2,"The trachea is lined with:","Pseudostratified columnar epithelium with goblet cells and cilia",["Simple squamous epithelium","Stratified squamous epithelium","Simple columnar epithelium with microvilli"],"Trachea: pseudostratified columnar epithelium with mucus-secreting goblet cells."],
[2,"Cilia in the trachea propel mucus containing dust and bacteria:","Away from the lungs, toward the pharynx",["Down into the lungs","Into the esophagus directly","Toward the alveoli to be absorbed"],"Mucus moves up toward the pharynx to be coughed up or swallowed."],
[2,"Why are the tracheal cartilage rings C-shaped?","So the esophagus can expand when a food bolus is swallowed",["To allow the trachea to produce sound","To let air leak into the esophagus","Because the trachea has no cartilage posteriorly to save weight"],"The open part of the C faces the esophagus so it can expand."],
[2,"The trachea extends from the larynx through the neck into the ______, where it divides.","Mediastinum",["Pleural cavity","Abdominal cavity","Pericardial cavity"],"The trachea goes into the mediastinum and divides into the R and L primary bronchi."],
[2,"Secondary bronchi go to the lobes of the lungs. How many lobes does each lung have?","Right 3, left 2",["Right 2, left 3","Both have 3","Both have 2"],"Right lung 3 lobes, left lung 2 (space for the heart)."],
[2,"What is the last site of small hyaline cartilage plates in the airway?","Terminal bronchioles",["Respiratory bronchioles","Tertiary bronchi","Alveolar ducts"],"Terminal bronchioles are the last place with cartilage plates."],
[2,"Where is the FIRST site of gas exchange?","Respiratory bronchioles",["Terminal bronchioles","Trachea","Tertiary bronchi"],"Respiratory bronchioles are the 1st site of gas exchange."],
[2,"Alveoli are composed of:","A very thin single layer of squamous epithelium over a thin basal lamina",["Pseudostratified ciliated columnar epithelium","Stratified squamous epithelium","Hyaline cartilage plates"],"The thin simple squamous wall allows rapid diffusion."],
[2,"The respiratory membrane, the site of gas exchange, is formed by:","The basal laminae of the alveoli and capillaries joined by connective tissue",["The parietal and visceral pleura","The vocal folds","The walls of the bronchi"],"Alveolar and capillary basal laminae fused together = respiratory membrane."],
[2,"Alveolar sacs are often described as looking like:","Clusters of grapes",["A tree trunk","An apron","A shield"],"Alveolar sacs = clusters of grapes made of alveoli."],
[2,"What allows the lungs to expand and recoil?","Elastic connective tissue",["Skeletal muscle in the lung","Hyaline cartilage","Smooth muscle of the alveoli"],"Lungs contain elastic connective tissue."],
[2,"The parietal pleura:","Is the outer layer that attaches to the thoracic walls and diaphragm",["Is the inner layer covering the lung tissue","Lines the trachea","Covers the heart"],"Parietal = outer (wall); visceral = inner (on the organ)."],
[2,"The visceral pleura:","Is the inner layer covering the lung tissue",["Attaches to the diaphragm","Is the outer layer on the thoracic wall","Lines the alveoli"],"Visceral pleura covers the lung itself."],
[2,"What is the role of the serous fluid in the pleural space?","Creates a frictionless environment and makes the lungs adhere to the thoracic wall",["Exchanges gases with the blood","Traps dust and bacteria","Produces surfactant to fight infection"],"Pleural fluid reduces friction and keeps the lungs stuck to the chest wall."],

// 3 Breathing mechanics & control
[3,"Which muscles are the inspiratory muscles?","External intercostals and the diaphragm",["Internal intercostals and abdominals","Diaphragm only","Pectoralis major and trapezius"],"External intercostals lift the ribcage; the diaphragm flattens."],
[3,"During inspiration, the diaphragm:","Contracts and moves from a dome shape to a flattened position",["Relaxes into a dome shape","Moves upward into the thorax","Does not move"],"Contraction flattens the dome and enlarges the thoracic cavity."],
[3,"During inspiration, the volume of the lungs increases, so the air pressure inside the lungs:","Decreases below atmospheric pressure, so air flows in",["Increases above atmospheric pressure","Stays equal to atmospheric pressure","Becomes zero"],"Bigger volume means lower pressure, creating a partial vacuum that pulls air in."],
[3,"Why does lung volume increase when the thoracic cavity enlarges?","The lungs adhere to the thoracic walls",["The alveoli actively pump air","The trachea lengthens","The lungs contain skeletal muscle"],"Because of the pleural fluid, the lungs follow the chest wall."],
[3,"During quiet expiration:","Muscles relax and the elastic lung tissue recoils, raising lung pressure above atmospheric",["Muscles contract to push air out","Lung pressure drops below atmospheric","The diaphragm flattens"],"Smaller volume pushes gas molecules closer together, raising the pressure and forcing air out."],
[3,"Where is the primary respiratory center?","Medulla",["Pons","Hypothalamus","Cerebellum"],"The medulla is the primary respiratory (and expiratory) center."],
[3,"The pons contains which respiratory centers?","Apneustic and pneumotaxic",["Inspiratory and expiratory","Cardiac and vasomotor","Thermoregulatory"],"Pons = apneustic and pneumotaxic centers (secondary centers)."],
[3,"Peripheral chemoreceptors are located in the:","Aortic arch and carotid sinus",["Medulla","Pons","Alveolar walls"],"Peripheral chemoreceptors sense O₂ and CO₂ in the aortic arch and carotid sinus."],
[3,"Central chemoreceptors in the brain mainly respond to changes in:","H⁺ (from CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻)",["Blood glucose","Body temperature","Blood pressure"],"CO₂ crosses into brain fluid, forms carbonic acid, and releases H⁺, which the central receptors detect."],
[3,"Which change would STIMULATE an increase in breathing?","An increase in blood CO₂",["An increase in blood O₂","A decrease in blood H⁺","A decrease in blood CO₂"],"Stimuli: increased CO₂ or H⁺, or decreased O₂."],
[3,"Vital capacity is:","The maximum amount of air that can be exhaled after a maximum inhalation",["The air left in the lungs after a forced exhale","The air in the conducting passages","Total air the lungs can hold including residual volume"],"Vital capacity = tidal + inspiratory reserve + expiratory reserve volumes."],
[3,"Residual volume is:","Air that remains in the lungs after a maximal forced exhalation",["Air moved in a normal breath","Extra air forcibly exhaled after a normal exhale","Air in the trachea and bronchi"],"Residual volume can't be exhaled; it keeps the alveoli open."],
[3,"Expiratory reserve volume is:","Extra air that can be forcibly exhaled after a normal exhalation",["Air remaining after maximal exhalation","Extra air inhaled after a normal inhalation","Air in a normal breath"],"ERV = what you can still push out after a normal breath out."],
[3,"Anatomical dead space refers to:","Air in the conducting passages that does not take part in gas exchange",["Air left in the lungs after forced exhalation","Collapsed alveoli","The pleural space"],"Dead space air never reaches the alveoli; alveolar ventilation subtracts it."],
[3,"Total lung capacity equals:","Vital capacity + residual volume",["Tidal volume + residual volume","Vital capacity − residual volume","Inspiratory reserve + expiratory reserve"],"TLC = all volumes added together, including residual volume."],

// 4 Gas transport & disorders
[4,"How is most oxygen carried in the blood?","About 97% bound to hemoglobin as oxyhemoglobin",["About 97% dissolved in plasma","About 70% as bicarbonate","Mostly as carbaminohemoglobin"],"O₂: 3% in plasma, 97% as oxyhemoglobin."],
[4,"What percent of oxygen is dissolved in plasma?","3%",["7%","23%","70%"],"Only about 3% of O₂ travels dissolved in plasma."],
[4,"How is MOST carbon dioxide carried in the blood?","About 70% as bicarbonate (HCO₃⁻) in plasma",["About 70% dissolved in plasma","About 70% as carbaminohemoglobin","About 97% bound to hemoglobin"],"CO₂: 7% dissolved, 23% carbaminohemoglobin, 70% bicarbonate."],
[4,"About what percent of CO₂ is carried as carbaminohemoglobin?","23%",["7%","70%","3%"],"23% of CO₂ binds to hemoglobin as carbaminohemoglobin."],
[4,"About what percent of CO₂ is dissolved directly in plasma?","7%",["3%","23%","70%"],"7% of CO₂ is dissolved in plasma."],
[4,"Which enzyme speeds up CO₂ + H₂O ⇌ H₂CO₃ inside red blood cells?","Carbonic anhydrase",["Pepsin","Lipase","Enterokinase"],"Carbonic anhydrase is part of the chloride shift."],
[4,"The chloride shift describes:","Bicarbonate leaving red blood cells in exchange for chloride ions entering",["Chloride being secreted into the stomach","Chloride binding to hemoglobin","Oxygen replacing chloride on hemoglobin"],"HCO₃⁻ moves out of the RBC into plasma and Cl⁻ moves in to keep the charges balanced."],
[4,"The Bohr effect states that a lower pH (more H⁺/CO₂) causes hemoglobin to:","Release O₂ more readily (lower affinity)",["Hold O₂ more tightly","Carry more CO₂ as bicarbonate","Stop binding O₂ entirely"],"Active tissues are acidic, so hemoglobin unloads more O₂ there (curve shifts right)."],
[4,"A hemoglobin dissociation curve shows the relationship between:","Oxygen partial pressure (PO₂) and percent hemoglobin saturation",["Blood pressure and heart rate","Lung volume and time","pH and temperature"],"It plots % O₂ saturation of hemoglobin against PO₂."],
[4,"Gas transport in the blood occurs between which two processes?","External and internal respiration",["Inspiration and expiration","Ventilation and digestion","Glycolysis and the Krebs cycle"],"Blood carries gases from the lungs (external) to the tissues (internal)."],
[4,"Asthma and chronic bronchitis/emphysema (COPD) are examples of:","Obstructive disorders: increased airway resistance",["Restrictive disorders","Metabolic disorders","Temperature disorders"],"Obstructive = trouble getting air OUT because the airways are narrowed."],
[4,"Pulmonary fibrosis, which reduces how much the lungs can expand, is a(n):","Restrictive disorder",["Obstructive disorder","Digestive disorder","Hormonal disorder"],"Restrictive = reduced lung expansion, which lowers total lung capacity."],

// 5 Digestive overview & tunics
[5,"The major function of the digestive system is to provide the body with:","Nutrients, water and electrolytes",["Oxygen and hormones","Blood cells","Antibodies"],"Digestive system: nutrients, water, electrolytes."],
[5,"Absorption is defined as:","Passage of nutrients from the GI tract into the blood",["Breaking food into smaller pieces","Taking food into the mouth","Removing waste via defecation"],"Absorption = GI tract to blood."],
[5,"Chemical digestion occurs by:","Enzymatic hydrolysis",["Mastication","Churning","Peristalsis"],"Chemical breakdown uses enzymes (hydrolysis); physical breakdown is chewing and churning."],
[5,"Mechanical (physical) digestion includes:","Mastication (chewing) and churning",["Enzymatic hydrolysis","Absorption into lacteals","Bile production"],"Chewing in the mouth and churning in the stomach."],
[5,"Elimination of waste occurs via:","Defecation",["Absorption","Ingestion","Emulsification"],"Elimination = waste via defecation."],
[5,"What is the correct order of the alimentary canal?","Mouth → pharynx → esophagus → stomach → small intestine → large intestine → rectum → anus",["Mouth → esophagus → pharynx → stomach → small intestine → large intestine → anus","Mouth → pharynx → stomach → esophagus → large intestine → small intestine → anus","Mouth → pharynx → esophagus → stomach → large intestine → small intestine → rectum → anus"],"Mouth, pharynx, esophagus, stomach, SI, LI, rectum, anus."],
[5,"Which is NOT an accessory digestive organ?","Stomach",["Liver","Pancreas","Gallbladder"],"Accessory organs: salivary glands, gallbladder, liver, pancreas. The stomach is part of the alimentary canal."],

[14,"Which hormone does NOT promote the post-absorptive (fasting) state?","Insulin",["Glucagon","Epinephrine","Glucocorticoids"],"Post-absorptive: glucagon, epinephrine, glucocorticoids, thyroxine, growth hormone. Insulin runs the fed state."],
[14,"Which list of hormones controls the post-absorptive state?","Glucagon, epinephrine, glucocorticoids, thyroxine, growth hormone",["Insulin, secretin, CCK","Insulin, gastrin, glucagon","Aldosterone, ADH, insulin"],"Straight from your notes."],
[14,"Anabolism refers to:","Building larger molecules from smaller ones (uses energy)",["Breaking molecules down to release energy","Removing amino groups","Heat loss through sweating"],"Anabolism builds; catabolism breaks down."],
[14,"Catabolism refers to:","Breaking down molecules, releasing energy",["Building proteins from amino acids","Storing glycogen","Absorbing nutrients"],"Catabolism = breakdown."],
[14,"A food Calorie (capital C) is equal to:","1,000 calories (1 kilocalorie)",["1 calorie","100 calories","10 calories"],"Calorie (kcal) = 1,000 calories."],
[14,"For every 1 L of O₂ used, the body produces/consumes about:","4.8 Calories",["1 Calorie","9 Calories","48 Calories"],"1 L O₂ ≈ 4.8 Cal, which is how metabolic rate is measured from O₂ consumption."],
[14,"Which relationship lets metabolic rate be measured indirectly?","Food/calorie intake : oxygen consumption : heat production",["Heart rate : blood pressure : urine output","Bile production : fat absorption","Tidal volume : vital capacity"],"O₂ consumed in cellular respiration is proportional to heat (Calories) produced."],
[14,"Basal metabolic rate (BMR) is:","The energy used at rest, awake, after fasting, at a comfortable temperature",["The energy used during maximal exercise","The rate of glycogen storage","The amount of food eaten per day"],"BMR = minimum energy to keep the body alive at rest."],

// 15 Temperature regulation & complications
[15,"Which brain region acts as the body's thermostat?","Hypothalamus",["Medulla","Pons","Cerebellum"],"The hypothalamus holds the temperature set point."],
[15,"The normal temperature set point is:","98.6 °F / 37 °C",["99.6 °F / 38 °C","96.8 °F / 36 °C","100.4 °F / 38 °C"],"Set point: 98.6 °F / 37 °C."],
[15,"When body temperature drops BELOW the set point, the body responds with:","Shivering and vasoconstriction of superficial vessels",["Sweating and vasodilation","Sweating and vasoconstriction","Shivering and vasodilation"],"Too cold: make heat (shiver) and keep it (constrict skin vessels)."],
[15,"When body temperature rises ABOVE the set point, the body responds with:","Sweating and vasodilation of superficial vessels",["Shivering and vasoconstriction","Shivering and vasodilation","Vasoconstriction only"],"Too hot: lose heat by sweating and dilating skin vessels."],
[15,"A fever occurs when:","Pyrogens raise the hypothalamus' set point",["The hypothalamus is destroyed","Sweating stops permanently","The body loses its set point"],"Pyrogens reset the thermostat higher."],
[15,"Sweating cools the body mainly by which mechanism of heat loss?","Evaporation",["Conduction","Radiation","Convection"],"Heat is lost as sweat evaporates. Other mechanisms: radiation, conduction, convection."],
[15,"Heat transfer by direct contact with a cooler object (e.g., sitting on cold metal) is:","Conduction",["Radiation","Evaporation","Convection"],"Conduction = direct contact."],
[15,"Vasoconstriction of superficial vessels helps the body:","Conserve heat",["Lose heat","Produce sweat","Raise the set point"],"Less blood to the skin means less heat lost."],
[15,"Diabetes mellitus results from:","Lack of insulin or resistance to insulin, causing high blood glucose",["Too much insulin","Lack of glucagon","Lack of bile"],"Without insulin action, glucose cannot enter cells."],
[15,"In uncontrolled diabetes, excessive fat breakdown produces ketones, which can lead to:","Metabolic acidosis",["Metabolic alkalosis","Respiratory alkalosis","Hypothermia"],"Ketones are acids, so blood pH drops."],
[15,"Which lipoprotein is considered 'good cholesterol' because it carries cholesterol back to the liver?","HDL",["LDL","VLDL","Chylomicron"],"HDL = good (carries cholesterol away to the liver). LDL = 'bad' (deposits cholesterol in arteries)."],
[15,"High levels of which lipoprotein are linked to atherosclerosis (plaque in arteries)?","LDL",["HDL","Albumin","Hemoglobin"],"LDL delivers cholesterol to tissues and arteries."],
[15,"Loss of parietal cells (no intrinsic factor) leads to a deficiency of:","Vitamin B12 (pernicious anemia)",["Vitamin K","Vitamin D","Vitamin C"],"Intrinsic factor is needed to absorb B12."],
[15,"A deficiency of vitamin K (normally partly made by colon bacteria) mainly affects:","Blood clotting",["Vision","Bone calcium only","Collagen formation"],"Vitamin K is needed for clotting factors."]
];


// ---------- Core 50: the highest-yield, most commonly tested points ----------
const CORE_PREFIXES = [
"External respiration is gas exchange between","Internal respiration takes place at","What do the nasal conchae do?",
"Which is NOT one of the 3 main functions of the larynx?","The largest, shield-shaped","All laryngeal cartilages are hyaline cartilage EXCEPT",
"Why are the tracheal cartilage rings C-shaped?","Where is the FIRST site of gas exchange?","The respiratory membrane, the site of gas exchange",
"What is the role of the serous fluid in the pleural space?","During inspiration, the volume of the lungs increases","Where is the primary respiratory center?",
"Peripheral chemoreceptors are located in the","Which change would STIMULATE an increase in breathing?","How is most oxygen carried in the blood?",
"How is MOST carbon dioxide carried in the blood?","The Bohr effect","The chloride shift describes",
"What is the order of the tunics","How does the muscle of the esophagus change","Parietal cells produce","Chief cells produce",
"What extra layer of muscularis externa","What is the correct order of the 3 sections","Which 3 structures increase the surface area",
"A lacteal is","Peyer's patches are","Secretin stimulates","Cholecystokinin (CCK) controls","What does enterokinase do?",
"Intestinal bacteria (E. coli)","In the large intestine, the longitudinal muscle","Which salivary gland lies anterior to the ear",
"How many permanent teeth","What forms the bulk of the tooth?","The portal triad found","Kupffer cells are","The liver produces bile, which",
"Pancreatic juice is very alkaline","What is the correct order of the bile pathway",
"Which hormone controls the absorptive (fed) state?","Glycogenolysis is","Gluconeogenesis is","Which hormone does NOT promote the post-absorptive",
"For every 1 L of O₂ used","Basal metabolic rate (BMR) is","When body temperature drops BELOW","A fever occurs when",
"In uncontrolled diabetes","Which lipoprotein is considered 'good cholesterol'"
];
const CORE = CORE_PREFIXES.map(pre => Q.findIndex(q => q[1].startsWith(pre)));

// ---------- Setup ----------
const ARTIFACT_URL = "https://claude.ai/artifact/CbsgQDA1o5TiGRJnAhfdhP";
const LETTERS = "ABCD";
const MODES = {c:"Core Exam", r:"Random 40", t:"Topic drill"};
const LS_KEY = "bio426_attempts_v1", RX_KEY = "bio426_received_v1";
let quiz = null, attempts = [], received = [], db = null, isOwner = false;

const $ = id => document.getElementById(id);
const show = id => ["start","quiz","results"].forEach(s => $(s).classList.toggle("hidden", s !== id));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = ts => new Date(ts).toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
const level = p => p >= 80 ? ["s","Strong"] : p >= 60 ? ["r","Review"] : ["w","Study this"];
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const unlocked = () => attempts.some(a => a.core && a.complete);

// ---------- Start screen ----------
$("topicList").innerHTML = TOPICS.map((t,i) =>
  `<label><input type="checkbox" value="${i}" checked> ${esc(t)} <span class="note">(${Q.filter(q=>q[0]===i).length})</span></label>`).join("");

try { $("taker").value = localStorage.getItem("bio426_name") || ""; } catch(e){}
$("coreBtn").onclick = () => {
  const n = $("taker").value.trim();
  if (!n) { $("taker").focus(); $("taker").placeholder = "Enter your name first"; $("taker").classList.add("need"); return; }
  try { localStorage.setItem("bio426_name", n); } catch(e){}
  startQuiz(CORE, "c");
};
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  if (!unlocked()) return;
  if (b.dataset.mode === "random") startQuiz(shuffle(Q.map((_,i)=>i)).slice(0,40), "r");
  else $("topicPick").classList.toggle("hidden");
});
$("startTopics").onclick = () => {
  const sel = [...document.querySelectorAll("#topicList input:checked")].map(x=>+x.value);
  if (sel.length) startQuiz(Q.map((_,i)=>i).filter(i => sel.includes(Q[i][0])), "t");
};
$("allTopics").onclick = () => document.querySelectorAll("#topicList input").forEach(x=>x.checked=true);
$("noTopics").onclick = () => document.querySelectorAll("#topicList input").forEach(x=>x.checked=false);

function attemptRow(a, k, withName){
  const p = Math.round(100*a.correct/a.total), [c,l] = level(p);
  const label = withName ? `<b>${esc(a.name||"Someone")}</b> &nbsp;${p}% · ${a.correct}/${a.total} · ${esc(a.mode)}` : `<b>${p}%</b> &nbsp;${a.correct}/${a.total} · ${esc(a.mode)}`;
  return `<button data-k="${k}"><span>${label}</span><span class="note">${fmtDate(a.ts)} &nbsp;<span class="lvl ${c}">${l}</span></span></button>`;
}
function renderStart(){
  const open = unlocked();
  document.querySelectorAll(".mode").forEach(b => { b.disabled = !open; b.classList.toggle("locked", !open); });
  $("lockTag").className = "lvl " + (open ? "s" : "w");
  $("lockTag").textContent = open ? "Unlocked" : "🔒 Locked";
  $("lockNote").classList.toggle("hidden", open);
  if (!open) $("topicPick").classList.add("hidden");

  $("history").innerHTML = attempts.length ? attempts.map((a,k) => attemptRow(a,k,false)).join("") : `<p class="note">No attempts yet.</p>`;
  $("history").querySelectorAll("button").forEach(b => b.onclick = () => showResults(attempts[+b.dataset.k], false));

  $("inbox").classList.toggle("hidden", !(isOwner || received.length || location.hash === "#sent-results"));
  $("received").innerHTML = received.length ? received.map((a,k) => attemptRow(a,k,true)).join("") : `<p class="note">Nothing yet.</p>`;
  $("received").querySelectorAll("button").forEach(b => b.onclick = () => showResults(received[+b.dataset.k], false));
}

// ---------- Quiz (no feedback until the end) ----------
function startQuiz(ids, code){
  const items = shuffle(ids).map(i => {
    const opts = shuffle([Q[i][2], ...Q[i][3]]);
    return {i, opts, pick: -1};
  });
  quiz = {code, name: $("taker").value.trim(), items, pos: 0};
  show("quiz"); renderQ(); window.scrollTo(0,0);
}
function renderQ(){
  const it = quiz.items[quiz.pos], q = Q[it.i], n = quiz.items.length;
  $("qNum").textContent = `Question ${quiz.pos+1} of ${n}`;
  $("qMode").textContent = MODES[quiz.code];
  $("qBar").style.width = (100*quiz.pos/n) + "%";
  $("qTopic").textContent = TOPICS[q[0]];
  $("qText").textContent = q[1];
  $("qOpts").innerHTML = it.opts.map((o,k)=>`<button class="opt${k===it.pick?" sel":""}" data-k="${k}"><span class="k">${LETTERS[k]}</span>${esc(o)}</button>`).join("");
  $("qOpts").querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  $("backBtn").disabled = quiz.pos === 0;
  $("nextBtn").disabled = it.pick < 0;
  $("nextBtn").textContent = quiz.pos === n-1 ? "Finish" : "Next";
}
function pick(k){
  quiz.items[quiz.pos].pick = k;
  $("qOpts").querySelectorAll(".opt").forEach((b,j) => b.classList.toggle("sel", j===k));
  $("nextBtn").disabled = false;
}
$("nextBtn").onclick = () => {
  if (quiz.pos < quiz.items.length-1) { quiz.pos++; renderQ(); window.scrollTo(0,0); } else finish();
};
$("backBtn").onclick = () => { if (quiz.pos > 0) { quiz.pos--; renderQ(); } };
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) pick(k % 4);
  else if (e.key === "Enter" && !$("nextBtn").disabled) $("nextBtn").click();
});

// ---------- Scoring ----------
function buildAttempt({ts, name, code, answers}){
  // answers: [[questionIndex, choice]] where choice 0 = correct, 1-3 = wrong option
  const topics = TOPICS.map(()=>[0,0]);
  answers.forEach(([i,k]) => { topics[Q[i][0]][1]++; if (k===0) topics[Q[i][0]][0]++; });
  const correct = answers.filter(([,k]) => k===0).length;
  return {ts, name: name||"", code, mode: MODES[code]||"Test", core: code==="c", complete: true,
          answers, total: answers.length, correct, topics};
}
function finish(){
  const answers = quiz.items.map(it => {
    const chosen = it.opts[it.pick];
    return [it.i, chosen === Q[it.i][2] ? 0 : Q[it.i][3].indexOf(chosen) + 1];
  });
  const a = buildAttempt({ts: Date.now(), name: quiz.name, code: quiz.code, answers});
  attempts.unshift(a);
  lsSet(LS_KEY, attempts.slice(0,100));
  if (db) db.collection("attempts").doc("a"+a.ts).set(a).catch(()=>{});
  showResults(a, true);
}

// ---------- Results links ----------
// Format: #r-<time>-<mode>-<answers, 2 base-36 chars each>-<name words>
function resultLink(a){
  const ans = a.answers.map(([i,k]) => (i*4+k).toString(36).padStart(2,"0")).join("");
  const name = (a.name||"").normalize("NFKD").replace(/[^A-Za-z0-9 ]/g,"").trim().split(/\s+/).filter(Boolean).slice(0,4).join("-").slice(0,40);
  return `${ARTIFACT_URL}#r-${a.ts.toString(36)}-${a.code}-${ans}${name ? "-"+name : ""}`;
}
function parseResult(text){
  const m = /#?(r-[a-z0-9]+-[crt]-[a-z0-9]+(?:-[A-Za-z0-9]+)*)/.exec(String(text).trim());
  if (!m) return null;
  const [, ts, code, ans, ...nameParts] = m[1].split("-");
  if (ans.length % 2) return null;
  const answers = [];
  for (let p = 0; p < ans.length; p += 2) {
    const n = parseInt(ans.slice(p,p+2),36), i = Math.floor(n/4), k = n%4;
    if (!Q[i] || (k>0 && !Q[i][3][k-1])) return null;
    answers.push([i,k]);
  }
  if (!answers.length) return null;
  const a = buildAttempt({ts: parseInt(ts,36), name: nameParts.join(" "), code, answers});
  a.received = true; a.id = m[1].slice(0,120);
  return a;
}
function addReceived(a){
  received = [a, ...received.filter(x => x.id !== a.id)].sort((x,y)=>y.ts-x.ts);
  lsSet(RX_KEY, received.slice(0,300));
  if (db) db.collection("shared").doc(a.id).set(a).catch(()=>{});
}
function openFromHash(){
  if (location.hash === "#sent-results") { show("start"); renderStart(); $("sent-results").scrollIntoView(); return; }
  const a = parseResult(location.hash);
  if (a) { addReceived(a); showResults(a, false); }
}
$("importBtn").onclick = () => {
  const a = parseResult($("importBox").value);
  if (!a) { $("importMsg").textContent = "That doesn't look like a results link."; return; }
  $("importBox").value = ""; $("importMsg").textContent = "";
  addReceived(a); showResults(a, false);
};
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("sendBox").value); $("copyMsg").textContent = "✓ Copied"; }
  catch(e){ $("sendBox").select(); $("copyMsg").textContent = "Press Ctrl+C (or ⌘+C) to copy."; }
};

// ---------- Results screen ----------
function showResults(a, fresh){
  show("results"); window.scrollTo(0,0);
  const p = Math.round(100*a.correct/a.total);
  $("rTitle").textContent = a.received ? (a.name || "Someone") + "'s results" : "Results";
  $("rDate").textContent = `${a.mode} · ${fmtDate(a.ts)}` + (fresh && a.core ? " · Extra practice unlocked" : "");
  $("rPct").textContent = p + "%";
  $("rCorrect").textContent = a.correct;
  $("rWrong").textContent = a.total - a.correct;
  $("rSend").classList.toggle("hidden", !!a.received || !a.answers);
  if (a.answers && !a.received) $("sendBox").value = resultLink(a);
  $("copyMsg").textContent = "";

  const ranked = a.topics.map((t,i)=>({i,c:t[0],n:t[1],p:t[1]?Math.round(100*t[0]/t[1]):0})).filter(x=>x.n).sort((x,y)=>x.p-y.p);
  $("rTable").innerHTML = `<tr><th>Topic</th><th>Score</th><th style="width:30%"></th><th></th></tr>` + ranked.map(x => {
    const [c,l] = level(x.p), col = c==="s"?"var(--good)":c==="r"?"var(--warn)":"var(--bad)";
    return `<tr><td>${esc(TOPICS[x.i])}</td><td>${x.c}/${x.n}</td><td><div class="bar"><div style="width:${x.p}%;background:${col}"></div></div></td><td><span class="lvl ${c}">${l}</span></td></tr>`;
  }).join("");

  const group = (f) => ranked.filter(f).map(x=>`<li>${esc(TOPICS[x.i])} (${x.p}%)</li>`).join("");
  const weak = group(x=>x.p<60), review = group(x=>x.p>=60&&x.p<80), strong = group(x=>x.p>=80);
  $("rStudy").innerHTML = `<h3>What to study</h3>` +
    (weak ? `<p class="gh" style="color:var(--bad)">Start here</p><ul class="study">${weak}</ul>` : "") +
    (review ? `<p class="gh" style="color:var(--warn)">Review next</p><ul class="study">${review}</ul>` : "") +
    (strong ? `<p class="gh" style="color:var(--good)">Know well</p><ul class="study">${strong}</ul>` : "");

  const answers = a.answers || [];
  const missed = answers.filter(([,k])=>k>0), right = answers.filter(([,k])=>k===0);
  $("rMissed").innerHTML = missed.length ? missed.map(([i,k]) => `
    <div class="miss">
      <div class="note">${esc(TOPICS[Q[i][0]])}</div>
      <div><b>${esc(Q[i][1])}</b></div>
      <div class="yours">✗ ${esc(Q[i][3][k-1])}</div>
      <div class="right">✓ ${esc(Q[i][2])}</div>
      <div class="ex">${esc(Q[i][4])}</div>
    </div>`).join("") : `<div class="card">None. Perfect score!</div>`;
  $("rRight").innerHTML = right.length ? `<ul class="study">${right.map(([i]) => `<li>${esc(Q[i][1])} <span class="right">✓ ${esc(Q[i][2])}</span></li>`).join("")}</ul>` : `<p class="note">None.</p>`;
}
$("homeBtn").onclick = () => {
  if (location.hash) try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
  renderStart(); show("start"); window.scrollTo(0,0);
};

// ---------- Load ----------
attempts = lsGet(LS_KEY, []).filter(a => a && a.ts && a.total);
received = lsGet(RX_KEY, []).filter(a => a && a.id && a.answers);
renderStart();
openFromHash();
window.addEventListener("hashchange", openFromHash);

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user");
    if (user) { try { isOwner = !!(await user.isOwner()); } catch(e){} renderStart(); }
    db = await window.claude.use("db");
    if (!db) return;
    const snap = await db.collection("attempts").orderBy("ts","desc").limit(200).get();
    const mine = new Map(attempts.map(a=>[a.ts,a]));
    snap.docs.forEach(d => { const x = d.data(); if (x && x.ts && x.total) mine.set(x.ts, x); });
    attempts = [...mine.values()].sort((x,y)=>y.ts-x.ts);
    const rs = await db.collection("shared").orderBy("ts","desc").limit(300).get();
    const byId = new Map(rs.docs.map(d => d.data()).filter(x => x && x.id && x.answers).map(x => [x.id, x]));
    for (const x of received) if (!byId.has(x.id)) { byId.set(x.id, x); db.collection("shared").doc(x.id).set(x).catch(()=>{}); }
    received = [...byId.values()].sort((x,y)=>y.ts-x.ts);
    lsSet(RX_KEY, received.slice(0,300));
    if (!$("start").classList.contains("hidden")) renderStart();
  } catch(e) { /* keep browser-only storage */ }
})();
</script>
